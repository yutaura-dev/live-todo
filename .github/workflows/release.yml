name: Release

# v1.2.3 の形のタグを push したら、macOS（Apple Silicon）向けに署名・公証したアプリを作り、下書きの Release に載せる（ADR-0018）
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    # 署名と公証の secrets は、この environment にだけ置く（タグからの実行だけに絞れる）
    environment: release
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # キャッシュを使わない理由: 配るものを作るジョブなので、ほかのジョブが書いたキャッシュ（汚染されうる）を読まない
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          require-lockfile: true

      - name: タグから版を決める
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::タグ $GITHUB_REF_NAME は v1.2.3 の形ではない"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 署名と公証の secrets があるか確かめる
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::署名と公証に要る secrets がない: ${missing[*]}（docs/release.md）"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm app:build

      - name: 署名・公証したアプリを作る
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # electron-builder は API キーをファイルのパスで受け取る
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          pnpm exec electron-builder --mac --arm64 --publish never -c.extraMetadata.version="$VERSION"

      - name: 署名と公証を確かめる
        run: |
          app="release/mac-arm64/live-todo.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      # 作った版をそのまま起動する。省略できる依存が入らず import に失敗するなど、配る版でしか起きない問題を止めるため
      - name: 配る版が起動できるか確かめる
        run: |
          output="$(perl -e 'alarm 120; exec @ARGV' env LIVE_TODO_SMOKE=1 release/mac-arm64/live-todo.app/Contents/MacOS/live-todo 2>&1)" || { echo "$output"; exit 1; }
          echo "$output" | grep -q "画面を読み込めた" || { echo "$output"; echo "::error::画面を読み込めなかった"; exit 1; }

      - name: 下書きの Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "live-todo $VERSION" \
            release/*.dmg release/*.zip
